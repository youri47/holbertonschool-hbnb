<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HBnB - Add Review</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="icon.png" type="image/png">
</head>
<body>
    <header>
        <img src="logo.png" alt="HBnB Logo" class="logo">
        <nav>
            <a href="index.html" class="login-button">Home</a>
        </nav>
    </header>

    <main>
        <h1 class="review-page-title" id="place-title">Add a Review</h1>

        <section class="add-review">
            <h2>Add a Review</h2>
            <form id="review-form" class="form">
                <label for="review">Your Review:</label>
                <textarea id="review" name="review" required placeholder="Share your experience..."></textarea>

                <label for="rating">Rating:</label>
                <select id="rating" name="rating" required>
                    <option value="1">1 Star</option>
                    <option value="2">2 Stars</option>
                    <option value="3">3 Stars</option>
                    <option value="4">4 Stars</option>
                    <option value="5">5 Stars</option>
                </select>

                <button type="submit">Submit Review</button>
                <div id="review-message" class="message" style="display: none;"></div>
            </form>
        </section>
    </main>

    <footer>
        <p>© 2026 HBnB . All rights reserved.</p>
    </footer>

    <script src="scripts.js"></script>
</body>
</html>
